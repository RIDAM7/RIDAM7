# Re-renders the profile daily so the contribution grid in the hero matches the
# real calendar GitHub draws below the README. Everything else the renderer
# reads is render/data.json, which only changes when it is re-exported from the
# portfolio, so on most days the only diff is the grid and its two numbers.
#
# Commits only when the output changed. The renderer is deterministic, so a day
# with no new contributions produces no commit.

name: Refresh profile

on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['render/**']

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: render

      - run: node render.mjs
        working-directory: render

      - name: Commit if the render changed
        run: |
          if [ -z "$(git status --porcelain README.md assets)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git commit -m 'chore: refresh contribution grid'
          git pull --rebase
          git push
